<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Article Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <header class="bg-white shadow-md p-4">
    <nav class="flex justify-between items-center max-w-5xl mx-auto">
      <h1 class="text-2xl font-bold">Article Hub</h1>
      <ul class="flex gap-6">
        <li><a href="index.html">Home</a></li>
        <li><a href="articles.html">Articles</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="text-blue-600 font-semibold">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="max-w-3xl mx-auto mt-10 px-4">
    <h2 class="text-3xl font-bold mb-6">Get in Touch</h2>
    <form class="space-y-4">
      <input type="text" placeholder="Your Name" class="w-full border p-3 rounded" required />
      <input type="email" placeholder="Your Email" class="w-full border p-3 rounded" required />
      <textarea placeholder="Your Message" class="w-full border p-3 rounded h-32" required></textarea>
      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Send Message</button>
    </form>
  </main>

  <footer class="mt-20 text-center py-4 text-sm text-gray-600">
    &copy; 2025 Article Hub. All rights reserved.
  </footer>
</body>
</html>
